name: Android verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test isolated prototype helpers
        run: python3 -m unittest discover -s scripts/prototype/tests -p 'test_*.py'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Provision pinned SDK packages on the CI runner
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833' # Command-line Tools 23.0, Google repository metadata
          packages: 'platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build, JVM contract tests and lint
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          :fixture:assembleDebug :fixture:lintDebug
          :app:assembleFixtureDebug :app:assembleProductionRelease
          :app:testProductionDebugUnitTest :app:testFixtureDebugUnitTest :app:assembleFixtureDebugAndroidTest
          :app:lintProductionRelease
          :probe:assembleDebug :probe:testDebugUnitTest :probe:lintDebug :probe:assembleDebugAndroidTest
      - name: Check packaged build isolation
        run: |
          python3 scripts/verify_apk.py fixture/build/outputs/apk/debug/fixture-debug.apk --variant fixtureSender
          python3 scripts/verify_apk.py app/build/outputs/apk/production/release/app-production-release-unsigned.apk --variant productionRelease
          python3 scripts/verify_apk.py app/build/outputs/apk/fixture/debug/app-fixture-debug.apk --variant fixtureDebug
          python3 scripts/verify_probe_apk.py probe/build/outputs/apk/debug/probe-debug.apk
          ./gradlew --no-daemon :app:tasks --all > /tmp/observer-tasks.txt
          python3 -c 'from pathlib import Path; s=Path("/tmp/observer-tasks.txt").read_text(); assert "assembleFixtureDebug" in s and "assembleProductionRelease" in s; assert "assembleFixtureRelease" not in s'
          ./gradlew --no-daemon :fixture:tasks --all > /tmp/fixture-tasks.txt
          python3 -c 'from pathlib import Path; s=Path("/tmp/fixture-tasks.txt").read_text(); assert "assembleRelease" not in s'
          ./gradlew --no-daemon :probe:tasks --all > /tmp/probe-tasks.txt
          python3 -c 'from pathlib import Path; s=Path("/tmp/probe-tasks.txt").read_text(); assert "assembleDebug" in s and "assembleRelease" not in s'
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            fixture/build/reports/
            probe/build/reports/
            probe/build/test-results/
            app/build/reports/
            app/build/test-results/
            build/reports/
          retention-days: 14

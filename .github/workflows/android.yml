name: Android foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install pinned SDK packages on CI runner
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build, JVM contract tests and lint
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          :app:assembleFixtureDebug :app:assembleProductionRelease
          :app:testProductionDebugUnitTest :app:assembleFixtureDebugAndroidTest
          :app:lintProductionRelease
      - name: Check packaged build isolation
        run: |
          python3 scripts/verify_apk.py app/build/outputs/apk/production/release/app-production-release-unsigned.apk --variant productionRelease
          python3 scripts/verify_apk.py app/build/outputs/apk/fixture/debug/app-fixture-debug.apk --variant fixtureDebug
          ./gradlew --no-daemon :app:tasks --all > /tmp/observer-tasks.txt
          python3 -c 'from pathlib import Path; s=Path("/tmp/observer-tasks.txt").read_text(); assert "assembleFixtureDebug" in s and "assembleProductionRelease" in s; assert "assembleFixtureRelease" not in s'
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
